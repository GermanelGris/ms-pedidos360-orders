server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    # Local: MySQL en Docker (infra/local). En AWS: DB_HOST = endpoint de la RDS
    url: jdbc:mysql://${DB_HOST:localhost}:3306/pedidos360_orders?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360}

pedidos360:
  messaging:
    # false: funciona sin RabbitMQ ni Kafka (EP1). true: publica eventos en Kafka y comandos en RabbitMQ
    enabled: ${MESSAGING_ENABLED:false}

services:
  catalog-url: ${CATALOG_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
